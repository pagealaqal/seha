  <main class="container">
   <div class="content">
    <h1>
     إنشاء حساب
    </h1>
    <p>
     أدخلي بياناتك في النموذج التالي.
    </p>
    <form onsubmit="return validateRegister()">
     <label>
      الاسم الكامل:
      <input id="fullName" placeholder="الاسم الكامل" type="text"/>
     </label>
     <label>
      البريد الإلكتروني:
      <input id="email" placeholder="name@example.com" type="text"/>
     </label>
     <label>
      كلمة المرور:
      <input id="password" placeholder="كلمة المرور" type="password"/>
     </label>
     <label>
      الهدف:
      <select id="goal">
       <option value="">
        اختاري هدفًا
       </option>
       <option>
        وجبات متوازنة
       </option>
       <option>
        خيارات نباتية
       </option>
       <option>
        وجبات عالية البروتين
       </option>
      </select>
     </label>
     <label>
      ملاحظات:
      <textarea id="notes" rows="5"></textarea>
     </label>
     <label class="check">
      <input id="terms" type="checkbox"/>
      أوافق على البيانات المدخلة
     </label>
     <input class="button" type="submit" value="إنشاء الحساب"/>
     <input class="button reset" type="reset" value="مسح البيانات"/>
    </form>
